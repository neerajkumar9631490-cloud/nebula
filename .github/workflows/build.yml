name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
      - name: Ensure Android project exists
        run: |
          flutter create --org com.nebula --project-name nebula --platforms android .
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application\n        android:usesCleartextTraffic="true"\n        android:extractNativeLibs="true"|' android/app/src/main/AndroidManifest.xml
          if [ -f android/app/build.gradle ]; then sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' android/app/build.gradle; fi
          if [ -f android/app/build.gradle.kts ]; then sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts; fi
      - run: flutter clean
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: nebula-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
