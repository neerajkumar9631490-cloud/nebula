name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'

      - name: Regenerate Android project as Movix
        run: |
          rm -rf android
          flutter create --org com.movix --project-name movix --platforms android .

      - run: flutter clean
      - run: flutter pub get

      - name: Icon and splash (only if icon exists)
        run: |
          if [ -f assets/icon.png ]; then
            dart run flutter_launcher_icons
            dart run flutter_native_splash:create
          else
            echo "No icon asset, skipping icon/splash"
          fi

      - name: Patch manifest AFTER icon/splash (TorrServer fix)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n        <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n        <uses-permission android:name="android.permission.WAKE_LOCK"/>\n        <application|' $M
          grep -q 'usesCleartextTraffic' $M || sed -i 's|<application|<application android:usesCleartextTraffic="true"|' $M
          grep -q 'extractNativeLibs' $M || sed -i 's|<application|<application android:extractNativeLibs="true"|' $M
          sed -i 's|android:label="[^"]*"|android:label="Movix"|' $M
          echo "=== PATCHED MANIFEST ==="
          cat $M

      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: movix-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
